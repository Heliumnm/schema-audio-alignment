<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-label="Correct, within-label-shuffled, and globally-shuffled audio-metadata alignment evaluated under source and matched cohorts.">
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1f2933}
.small{font-size:14px}.label{font-size:14px}.title{font-size:16px;font-weight:700}
.axis{stroke:#5f6b76;stroke-width:1}.grid{stroke:#d7dde3;stroke-width:1}
.zero{stroke:#27313a;stroke-width:1.2;stroke-dasharray:4 3}
.ci_ast{stroke:#2463a6;stroke-width:2}.point_ast{fill:#2463a6;stroke:#163f6b;stroke-width:1}
.ci_opera{stroke:#c26d15;stroke-width:2}.point_opera{fill:#c26d15;stroke:#7c420b;stroke-width:1}
.box{fill:#f5f7f9;stroke:#687682;stroke-width:1}
.correct{stroke:#2463a6;stroke-width:2.4}.within{stroke:#c26d15;stroke-width:2.4;stroke-dasharray:6 3}
.global{stroke:#687682;stroke-width:2.4;stroke-dasharray:2 3}
</style>
<desc>Correct, within-label-shuffled, and globally-shuffled audio-metadata alignment evaluated under source and matched cohorts.</desc>
<rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
<text x="20" y="25" class="title">Pairing-controlled audit under cohort shift</text>
<rect x="22" y="50" width="110" height="42" rx="4" class="box"/>
<text x="77.0" y="76" class="label" text-anchor="middle">Cough audio</text>
<rect x="160" y="50" width="110" height="42" rx="4" class="box"/>
<text x="215.0" y="68" class="label" text-anchor="middle">AST-6L</text>
<text x="215.0" y="84" class="small" text-anchor="middle">frozen</text>
<rect x="298" y="50" width="128" height="42" rx="4" class="box"/>
<text x="362.0" y="68" class="label" text-anchor="middle">Projector</text>
<text x="362.0" y="84" class="small" text-anchor="middle">trainable</text>
<rect x="454" y="50" width="72" height="42" rx="4" class="box"/>
<text x="490.0" y="76" class="label" text-anchor="middle">z_audio</text>
<rect x="22" y="116" width="110" height="42" rx="4" class="box"/>
<text x="77.0" y="134" class="label" text-anchor="middle">Metadata</text>
<text x="77.0" y="150" class="small" text-anchor="middle">schema text</text>
<rect x="160" y="116" width="110" height="42" rx="4" class="box"/>
<text x="215.0" y="134" class="label" text-anchor="middle">Phi-2</text>
<text x="215.0" y="150" class="small" text-anchor="middle">frozen</text>
<rect x="454" y="116" width="72" height="42" rx="4" class="box"/>
<text x="490.0" y="142" class="label" text-anchor="middle">z_text</text>
<line x1="132" y1="71" x2="160" y2="71" class="axis"/>
<line x1="270" y1="71" x2="298" y2="71" class="axis"/>
<line x1="426" y1="71" x2="454" y2="71" class="axis"/>
<line x1="132" y1="137" x2="160" y2="137" class="axis"/>
<line x1="270" y1="137" x2="454" y2="137" class="axis"/>
<text x="22" y="190" class="title">Training pair construction</text>
<line x1="30" y1="218" x2="116" y2="218" class="correct"/>
<text x="128" y="222" class="label">Correct</text>
<text x="274" y="222" class="small">z_audio(i) &lt;-&gt; z_text(i)</text>
<line x1="30" y1="252" x2="116" y2="252" class="within"/>
<text x="128" y="256" class="label">Within-label shuffle</text>
<text x="274" y="256" class="small">z_audio(i) &lt;-&gt; z_text(j),  y_i = y_j</text>
<line x1="30" y1="286" x2="116" y2="286" class="global"/>
<text x="128" y="290" class="label">Global shuffle</text>
<text x="274" y="290" class="small">z_audio(i) &lt;-&gt; z_text(k), unrestricted</text>
<rect x="590" y="48" width="168" height="82" rx="4" class="box"/>
<text x="674" y="71" class="label" text-anchor="middle">Standard source domain</text>
<text x="674" y="90" class="small" text-anchor="middle">recruitment -&gt; COVID</text>
<text x="674" y="112" class="title" text-anchor="middle">AUROC 0.9966</text>
<rect x="590" y="196" width="168" height="82" rx="4" class="box"/>
<text x="674" y="219" class="label" text-anchor="middle">Matched domain</text>
<text x="674" y="238" class="small" text-anchor="middle">recruitment -&gt; COVID</text>
<text x="674" y="260" class="title" text-anchor="middle">AUROC 0.5000</text>
<line x1="674" y1="130" x2="674" y2="196" class="zero"/>
<text x="22" y="318" class="small">Correct - within-label isolates participant correspondence while retaining label-level co-occurrence.</text>
</svg>
